name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Test baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The per-commit tier is unit tests only: no database, store or FFmpeg.
    # A unit test that reaches for one fails (scripts/unitTierGuard.cjs).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare
      # The larger test suites need more than Node's default 4 GB heap.
      - run: npm run precommit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  portable:
    name: Portable contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/deploy/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler: '4.0.3'
      - name: Install the pinned Caddy test binary
        run: |
          curl --fail --location --retry 3 https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/caddy.tar.gz"
          echo "a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7  $RUNNER_TEMP/caddy.tar.gz" | sha512sum --check
          mkdir -p .test-tools/caddy
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C .test-tools/caddy caddy
          echo "CADDY_BINARY=$GITHUB_WORKSPACE/.test-tools/caddy/caddy" >> "$GITHUB_ENV"
          .test-tools/caddy/caddy version
      - run: npm ci
      - run: npm run prepare
      - run: bundle install
      - run: npm run test:portable
