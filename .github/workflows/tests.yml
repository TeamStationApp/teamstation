name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Test baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/postgres
      TS_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image test dependency
        run: python -m pip install Pillow==12.0.0
      - name: Install the pinned FFmpeg binary
        run: |
          curl --fail --location --retry 3 https://github.com/TeamStationApp/teamstation/releases/download/tools-ffmpeg-9.0.1/ffmpeg-n9.0.1-30-g9258bacca5-linux64-gpl-9.0.tar.xz -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "82916751d9858ec7672f4b4a3552eacb345bc9f80c96df1b16a4ae8d8f25960a  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check
          mkdir -p .test-tools/ffmpeg
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C .test-tools/ffmpeg --strip-components=1
      - name: Configure the synthetic test environment
        run: |
          echo "$GITHUB_WORKSPACE/.test-tools/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "TS_FFMPEG=$GITHUB_WORKSPACE/.test-tools/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"
          node -e 'require("fs").writeFileSync("serverConfig.json", JSON.stringify({ffmpegPath: process.cwd() + "/.test-tools/ffmpeg/bin/ffmpeg", ffmpegVersion: "n9.0.1-30-g9258bacca5-20260915"}))'
          .test-tools/ffmpeg/bin/ffmpeg -version
          .test-tools/ffmpeg/bin/ffprobe -version
          .test-tools/ffmpeg/bin/ffmpeg -encoders | grep libx264
          .test-tools/ffmpeg/bin/ffmpeg -encoders | grep libx265
      - run: npm ci
      - run: npm run prepare
      - run: npm run precommit

  portable:
    name: Portable contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/deploy/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler: '4.0.3'
      - name: Install the pinned Caddy test binary
        run: |
          curl --fail --location --retry 3 https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/caddy.tar.gz"
          echo "a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7  $RUNNER_TEMP/caddy.tar.gz" | sha512sum --check
          mkdir -p .test-tools/caddy
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C .test-tools/caddy caddy
          echo "CADDY_BINARY=$GITHUB_WORKSPACE/.test-tools/caddy/caddy" >> "$GITHUB_ENV"
          .test-tools/caddy/caddy version
      - run: npm ci
      - run: npm run prepare
      - run: bundle install
      - run: npm run test:portable
