apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Links the Expo modules into the app, which here stands where the `expo`
// package's own library would, and generates `expo.modules.ExpoModulesPackageList`.
apply plugin: "expo-autolinking"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * The app's link host, from the build's gitignored clientConfig.json at the
 * repository root: `appOrigin` without its scheme, or empty without one.
 * Babel inlines the same value into the bundle (scripts/appOrigin.cjs).
 */
def clientConfigFile = file("../../clientConfig.json")
// An explicit TS_APP_ORIGIN wins even when empty, as in appOrigin.cjs: an empty
// value is a build with no link host, not a missing one.
def appOriginEnv = System.getenv("TS_APP_ORIGIN")
def appOriginValue = appOriginEnv != null ? appOriginEnv : (
    clientConfigFile.exists()
        ? (new groovy.json.JsonSlurper().parse(clientConfigFile).appOrigin ?: "")
        : ""
)
def appLinkHost = appOriginValue ? new URI(appOriginValue).host : ""

// Babel inlines TS_API_BASE_URL, TS_SENTRY_DSN, TS_BUILD_INFO and TS_APP_ORIGIN
// into the bundle (babel.config.js), but none of them is one of the bundle
// task's inputs, so Gradle called a bundle made for another value up to date
// and packed it again. Declared here, a new value rebuilds the bundle and the
// same value does not. The app origin is declared by its value, not as the
// file, because a build without a clientConfig.json has no file to declare.
tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
    inputs.property("TS_APP_ORIGIN", appOriginValue)
    inputs.property("TS_API_BASE_URL", providers.environmentVariable("TS_API_BASE_URL").orElse(""))
    inputs.property("TS_SENTRY_DSN", providers.environmentVariable("TS_SENTRY_DSN").orElse(""))
    inputs.property("TS_BUILD_INFO", providers.environmentVariable("TS_BUILD_INFO").orElse(""))
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "app.teamstation.app"
    defaultConfig {
        applicationId "app.teamstation.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders += [appLinkHost: appLinkHost,
            googleMapsApiKey: System.getenv("GOOGLE_MAPS_ANDROID_API_KEY") ?: ""]
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('TS_ANDROID_DEBUG_KEYSTORE') ?: 'debug.keystore')
            storePassword System.getenv('TS_ANDROID_DEBUG_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('TS_ANDROID_DEBUG_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('TS_ANDROID_DEBUG_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// The sign-in link filter for the app's link host, added to every variant's
// manifests only when the build has one, so a build without config claims no
// https address at all.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (appLinkHost) variant.sources.manifests.addStaticManifestFile("src/appLinks/AndroidManifest.xml")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Camera capture, lenses, encoders and radar, shared with TS Cameraman for Android.
    implementation project(':streamcore')

    // Walk-up songs play through ExoPlayer, at the version react-native-video
    // already brings (RNVideo_media3Version), so the app carries one copy.
    implementation("androidx.media3:media3-exoplayer:1.8.0")
    // Live HLS players get a playlist tracker that waits out a publisher's
    // absence (LivePlaylistPatience), at the same version.
    implementation("androidx.media3:media3-exoplayer-hls:1.8.0")
    // Predictive back's progress (`BackEventCompat` and the dispatcher's
    // started/progressed/cancelled callbacks) for the stack navigator's drag;
    // React Native alone brings 1.7, from before they existed.
    implementation("androidx.activity:activity:1.9.3")
    // Share Lineup's QR code camera: CameraX for the picture, and ML Kit's
    // bundled barcode scanner, which needs no Play services, to read it.
    implementation("androidx.camera:camera-camera2:1.6.2")
    implementation("androidx.camera:camera-lifecycle:1.6.2")
    implementation("androidx.camera:camera-view:1.6.2")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")
    // LocalFileIdTest reads the fixtures it shares with localFileId.test.ts.
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * The fonts, copied in rather than kept here: Space Grotesk, the app's type;
 * Inter and Quicksand, the scoreboard's; and the icons.
 *
 * `app/assets/fonts` is the one copy — `ios` embeds those very files — and
 * Android resource names may only be lowercase with underscores, so they
 * cannot simply be pointed at. The copy and the family declarations are
 * generated at build time, which is one fewer set of files to keep in step and
 * makes `tools/makeFonts.py` the only way either platform's fonts change.
 *
 * An XML font family rather than the `assets/fonts` convention React Native
 * also accepts: that one understands `bold` and nothing else, so `fontWeight:
 * '500'` and `'600'` — which the theme uses throughout — would both round to
 * regular and the app would lose two of its four weights.
 */
def tsFontRes = layout.buildDirectory.dir("generated/tsFonts/res")
def tsFontSource = file("$rootDir/../src/app/assets/fonts")

tasks.register('tsFonts', Copy) {
    description = 'Copies the shared fonts into a generated resource directory'
    from(tsFontSource) {
        include '*.ttf'
        rename { name ->
            name.replaceAll(/([a-z0-9])([A-Z])/, '$1_$2')
                .replace('-', '_')
                .toLowerCase()
        }
    }
    into tsFontRes.map { it.dir("font") }
    doLast {
        // Both namespaces, and that is not belt and braces. `addCustomFont`
        // reads this through `ResourcesCompat.getFont`, whose compat parser
        // looks for the `app:` attributes, while the framework parser reads
        // the `android:` ones. Emit one and some devices find four weights and
        // others find one.
        def familyFile = { file, weight ->
            "    <font android:fontStyle=\"normal\" android:fontWeight=\"$weight\" android:font=\"@font/$file\"" +
            " app:fontStyle=\"normal\" app:fontWeight=\"$weight\" app:font=\"@font/$file\" />"
        }
        ['space_grotesk', 'inter', 'quicksand'].each { family ->
            tsFontRes.get().dir("font").file("${family}.xml").asFile.text = """<?xml version="1.0" encoding="utf-8"?>
<font-family xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto">
${familyFile("${family}_regular", 400)}
${familyFile("${family}_medium", 500)}
${familyFile("${family}_semi_bold", 600)}
${familyFile("${family}_bold", 700)}
</font-family>
"""
        }
    }
}

android.sourceSets.main.res.srcDirs += tsFontRes
tasks.named('preBuild') { dependsOn('tsFonts') }
