[package]
name = "chat-link-preview"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# The phone links one static archive containing both native modules.
mobile-crypto = ["dep:chat-crypto"]

[dependencies]
encoding_rs = "=0.8.35"
chat-crypto = { path = "../chat-crypto", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ip_network = "=0.4.1"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
base64 = "=0.22.1"
