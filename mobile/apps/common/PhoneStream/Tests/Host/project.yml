name: PhoneStreamHost

# The host app PhoneStream's unit tests run inside, on an iPhone simulator: the engine's encoders
# need VideoToolbox on iOS, so the package cannot be tested with `swift test` on the Mac.
# Generated by scripts/test-unit.sh; the .xcodeproj is not committed.
options:
  bundleIdPrefix: app.teamstation
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: NO

packages:
  PhoneStream:
    path: ../..
  AdaptiveBitrate:
    path: ../../../AdaptiveBitrate
  CameramanCapture:
    path: ../../../CameramanCapture
  CameramanCore:
    path: ../../../CameramanCore
  DirectorCore:
    path: ../../../DirectorCore
  DirectorExport:
    path: ../../../DirectorExport
  DirectorMedia:
    path: ../../../DirectorMedia
  DirectorRTMP:
    path: ../../../DirectorRTMP
  DirectorSources:
    path: ../../../DirectorSources
  TeamStationKit:
    path: ../../../TeamStationKit

targets:
  PhoneStreamHost:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teamstation.phonestreamhost
        PRODUCT_NAME: PhoneStreamHost
        INFOPLIST_FILE: App/Info.plist
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    # Every package the host or the engine's public types reach, linked directly: a package product
    # that two targets link becomes its own framework, and the types it re-exports must be linked
    # where they are used.
    dependencies:
      - package: PhoneStream
        product: PhoneStream
      - package: DirectorCore
        product: DirectorCore
      - package: TeamStationKit
        product: TeamStationKit

  PhoneStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../PhoneStreamTests
    dependencies:
      - target: PhoneStreamHost
      - package: PhoneStream
        product: PhoneStream
      - package: AdaptiveBitrate
        product: AdaptiveBitrate
      - package: CameramanCapture
        product: CameramanCapture
      - package: CameramanCore
        product: CameramanCore
      - package: DirectorCore
        product: DirectorCore
      - package: DirectorExport
        product: DirectorExport
      - package: DirectorMedia
        product: DirectorMedia
      - package: DirectorRTMP
        product: DirectorRTMP
      - package: DirectorSources
        product: DirectorSources
      - package: TeamStationKit
        product: TeamStationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teamstation.phonestreamhost.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhoneStreamHost.app/PhoneStreamHost
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  PhoneStreamHost:
    build:
      targets:
        PhoneStreamHost: all
        PhoneStreamTests: [ test ]
    test:
      gatherCoverageData: true
      targets:
        - PhoneStreamTests
