appId: co.gamestation.cameraman
---
# Renaming changes what Producer shows and nothing else. The identifier has to survive it, because
# it is what binds this camera to its tile, its archive and its telemetry — a rename that changed it
# would silently create a second camera every time an operator corrected a typo.
- launchApp
- waitForAnimationToEnd:
    timeout: 8000

- tapOn:
    id: "settings-button"
- waitForAnimationToEnd:
    timeout: 3000

- scrollUntilVisible:
    element:
      id: "settings-cname"
    direction: DOWN
    timeout: 10000
- copyTextFrom:
    id: "settings-cname"
- evalScript: ${output.cname = maestro.copiedText}

- tapOn:
    id: "settings-name-field"
- eraseText
- inputText: "Third Base"
- hideKeyboard

- tapOn:
    id: "settings-done"
- waitForAnimationToEnd:
    timeout: 3000

# The new name is on the operating screen at once, without a restart.
- assertVisible:
    id: "camera-name"
    text: "Third Base"

# And it survives being sent round again, with the identity unchanged.
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "settings-cname"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "settings-cname"
    text: ".*${output.cname}"

# An empty name is not a valid camera name, so the app falls back rather than showing a blank badge.
- tapOn:
    id: "settings-name-field"
- eraseText
- hideKeyboard
- tapOn:
    id: "settings-done"
- waitForAnimationToEnd:
    timeout: 3000

# Asserted on the badge itself rather than as "Third Base appears nowhere": assertNotVisible matches
# text across the whole screen and would also fire on a dismissing sheet that has not finished
# animating away, which is a timing race and not the thing under test.
- assertVisible:
    id: "camera-name"
    text: "Camera [0-9A-F]{4}"
