appId: co.gamestation.cameraman
---
# The app opens, the camera runs, and the operator-facing chrome is the name plus the zoom scale.
# Stream details live in Settings — asserting them here would pin chrome we just removed.
- launchApp
- waitForAnimationToEnd:
    timeout: 8000

- assertVisible:
    id: "camera-screen"
- assertVisible:
    id: "camera-name"

# Opens at 1x on the wide lens.
- assertVisible:
    id: "zoom-label"
- assertVisible:
    id: "zoom-preset-1x"
- assertVisible:
    id: "zoom-scale"
- assertVisible:
    id: "camera-thermal"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: overlay-landscape

- assertVisible:
    id: "flip-button"
- assertVisible:
    id: "settings-button"

# The address and client count moved into Settings. Opening the sheet must not hide the camera
# screen underneath in a way that a later flow cannot recover from.
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-landscape
- scrollUntilVisible:
    element:
      id: "settings-clients"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
    centerElement: true
- takeScreenshot: settings-row2
- assertVisible:
    id: "settings-url"
- assertVisible:
    id: "settings-url-copy"
# Count is live; Director on the LAN may already be connected.
- assertVisible:
    id: "settings-clients"
- assertVisible:
    id: "settings-name-edit"
- tapOn:
    id: "settings-done"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "camera-screen"
