appId: co.gamestation.cameraman
---
# Overlay thermal pill in the upper right. The zoom column starts below it so 9x stays tappable.
- launchApp
- waitForAnimationToEnd:
    timeout: 8000

- assertVisible:
    id: "camera-thermal"
- assertVisible:
    id: "zoom-scale"
- assertVisible:
    id: "zoom-preset-9x"
- assertVisible:
    id: "zoom-preset-1x"
- takeScreenshot: thermal-pill-zoom
