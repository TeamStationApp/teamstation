# Launch with the control channel so a Mac harness can mute audio and blank video.
# Maestro rather than devicectl so Local Network permission is offered.
appId: co.gamestation.cameraman
---
- launchApp:
    appId: co.gamestation.cameraman
    arguments:
      uiTest: true

- runFlow: shared/allow-permissions.yaml

- extendedWaitUntil:
    visible:
      id: 'camera-screen'
    timeout: 20000
