# What the operator chose is still there after a relaunch.
#
# A camera on a tripod is aimed once. Coming back on the wrong codec after a restart silently changes
# what Director records, and nobody is standing there to notice — so this is checked rather than
# assumed. `persistSettings` is on explicitly because `uiTest` turns it off by default, exactly so
# that the other flows neither inherit nor leave behind a preference.
appId: co.gamestation.cameraman
---
- launchApp:
    appId: co.gamestation.cameraman
    arguments:
      uiTest: true
      persistSettings: true

- tapOn:
    id: "settings-button"
- tapOn:
    id: "settings-codec-h264"
- assertVisible:
    text: "Bitrate  6.0 Mbps"
- tapOn:
    id: "settings-done"

- stopApp
- launchApp:
    appId: co.gamestation.cameraman
    clearState: false
    arguments:
      uiTest: true
      persistSettings: true

- tapOn:
    id: "settings-button"
- assertVisible:
    text: "Bitrate  6.0 Mbps"

# Put it back, so the flow leaves the handset as it found it.
- tapOn:
    id: "settings-codec-hevc"
- tapOn:
    id: "settings-done"
