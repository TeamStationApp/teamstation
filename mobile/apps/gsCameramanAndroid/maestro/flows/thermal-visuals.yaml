# The thermal pill shows each level on demand.
#
# It exists because a pill that only appears when a phone is genuinely hot cannot be checked before a
# match, and "wait for it to overheat" is not a test step. The preview buttons are only built under
# uiTest, so this flow cannot run against a shipping launch — which is the intent.
appId: co.gamestation.cameraman
---
- launchApp:
    appId: co.gamestation.cameraman
    arguments:
      uiTest: true

- assertVisible:
    id: "camera-thermal"

- tapOn:
    id: "settings-button"
# The preview buttons are the last thing in the right column, below lenses and stream. Each column
# scrolls on its own, and a scrollUntilVisible swipes at the middle of the screen, which is the gap
# between them; so the right column is swiped directly, twice, which overshoots harmlessly.
- swipe:
    start: "75%, 90%"
    end: "75%, 20%"
- swipe:
    start: "75%, 90%"
    end: "75%, 20%"
- assertVisible:
    id: "settings-test-thermal"

- tapOn:
    id: "settings-test-thermal-hot"
- tapOn:
    id: "settings-done"
- assertVisible:
    text: "HOT"

- tapOn:
    id: "settings-button"
- swipe:
    start: "75%, 90%"
    end: "75%, 20%"
- swipe:
    start: "75%, 90%"
    end: "75%, 20%"
- tapOn:
    id: "settings-test-thermal-cool"
- tapOn:
    id: "settings-done"
- assertVisible:
    text: "COOL"
