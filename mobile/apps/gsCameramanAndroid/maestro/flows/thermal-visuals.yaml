# The thermal pill shows each level on demand.
#
# It exists because a pill that only appears when a phone is genuinely hot cannot be checked before a
# match, and "wait for it to overheat" is not a test step. The preview buttons are only built under
# uiTest, so this flow cannot run against a shipping launch — which is the intent.
appId: co.gamestation.cameraman
---
- launchApp:
    appId: co.gamestation.cameraman
    arguments:
      uiTest: true

- assertVisible:
    id: "camera-thermal"

- tapOn:
    id: "settings-button"
# The preview buttons are the last thing in the right column, below lenses and stream. The screen
# is one scroll, so a swipe that starts on the right column moves that scroll.
- scrollUntilVisible:
    element:
      id: "settings-test-thermal"
    direction: UP
- assertVisible:
    id: "settings-test-thermal"

- tapOn:
    id: "settings-test-thermal-hot"
- tapOn:
    id: "settings-done"
- assertVisible:
    text: "HOT"

- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "settings-test-thermal-cool"
    direction: UP
- tapOn:
    id: "settings-test-thermal-cool"
- tapOn:
    id: "settings-done"
- assertVisible:
    text: "COOL"
