# Archive wall-clock RTSP farm. No clearState. Not in the operator suite.
#
# Simulator or M4 (Pauls iPad Pro (2)): LAN_HOSTS is semicolon-separated host:port
# (18554–18557). Commas are eaten by maestro-runner `-e`.
# Do not run this, or recordings-export.yaml, on the rec-88 iPad.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      uiTest: true
      debugHUD: true
      sourceProfile: rtsp
      rtspScan: false
      rtspHosts: "${LAN_HOSTS}"

- runFlow: shared/allow-local-network.yaml

- extendedWaitUntil:
    visible:
      id: 'source-row-4'
    timeout: 90000
- runFlow: shared/settle-source-list.yaml

- openLink: 'gsdirector://test/enable-source?index=1&on=true'
- openLink: 'gsdirector://test/enable-source?index=2&on=true'
- openLink: 'gsdirector://test/enable-source?index=3&on=true'
- openLink: 'gsdirector://test/enable-source?index=4&on=true'
- openLink: 'gsdirector://test/start'

- extendedWaitUntil:
    visible:
      id: 'source-4'
    timeout: 30000
