# Signs the Director in to GameStation, against a development seat.
#
# The code arrives by e-mail, which a test cannot read, so this waits at the
# code screen long enough for whoever is running it to put a known code on
# the request — `update email_codes set code_hash = sha256('414243') …` for
# the newest unconsumed row — and then types that. Against a real server the
# wait is where a person types what they were sent instead.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
- extendedWaitUntil:
    visible:
      id: 'start-directing'
    timeout: 30000
- tapOn:
    id: 'start-directing'
- extendedWaitUntil:
    visible:
      id: 'settings-button'
    timeout: 30000
- tapOn:
    id: 'settings-button'
- extendedWaitUntil:
    visible:
      id: 'settings-gamestation-account'
    timeout: 20000
- tapOn:
    id: 'settings-gamestation-account'
- extendedWaitUntil:
    visible:
      id: 'gamestation-email'
    timeout: 20000
- tapOn:
    id: 'gamestation-email'
- inputText: 'paul@vtex.net'
- hideKeyboard
- tapOn:
    id: 'gamestation-send-code'
- extendedWaitUntil:
    visible:
      id: 'gamestation-code'
    timeout: 30000
- takeScreenshot: shot-awaiting-code

# The window in which the code is put on the request.
- swipe:
    start: 50%, 50%
    end: 50%, 50%
    duration: 40000

- tapOn:
    id: 'gamestation-code'
- inputText: '414243'
- hideKeyboard
- tapOn:
    id: 'gamestation-submit-code'
- extendedWaitUntil:
    visible:
      id: 'gamestation-sign-out'
    timeout: 30000
- takeScreenshot: shot-signed-in
