# B9: disabling the on-air camera leaves exactly one Output highlight.
#
# Synthetic is enough for this UI bug. Live rewind is a different vector.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      sourceCount: 3
      syntheticEntropy: low

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- extendedWaitUntil:
    visible: '1/5 enabled'
    timeout: 8000
- tapOn:
    id: 'source-toggle-2'
- extendedWaitUntil:
    visible: '2/5 enabled'
    timeout: 8000
- tapOn:
    id: 'source-toggle-3'
- extendedWaitUntil:
    visible: '3/5 enabled'
    timeout: 8000
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 20000
- extendedWaitUntil:
    visible: 'source=3 state=live.*'
    timeout: 20000

- tapOn:
    id: 'source-2'
- extendedWaitUntil:
    visible: 'output src=CAM2 .*'
    timeout: 8000
- assertVisible: 'source=2 .*onair=1'
- assertVisible: 'source=1 .*onair=0'
- assertVisible: 'source=3 .*onair=0'

- tapOn:
    id: 'cameras-button'
- extendedWaitUntil:
    visible: 'Choose up to five cameras for the director grid, and whose audio to mix.'
    timeout: 15000
- tapOn:
    id: 'source-toggle-2'
- extendedWaitUntil:
    visible: '2/5 enabled'
    timeout: 8000
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=2 state=empty .*'
    timeout: 15000
- assertVisible: 'source=2 .*onair=0'
- assertVisible: 'source=1 .*onair=1'
- assertVisible: 'source=3 .*onair=0'
- assertVisible: 'output src=CAM1 .*'
- assertVisible:
    id: 'output'
