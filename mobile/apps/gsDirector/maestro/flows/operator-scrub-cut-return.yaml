# D3/D4/E1–E7: scrub a non-program tile, cut it to PROGRAM while rewound, Return to Live,
# and prove the small previews actually play (`out=`), not freeze on the last replay frame.
#
# Cut while `off=-` (scrubbing still or moving replay). A replay of N seconds returns to live
# after N seconds, so extra asserts between swipe and tap lose the rewound state.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      sourceCount: 3
      cameraCodec: hevc
      segmentSeconds: 2
      syntheticEntropy: low
      archiveAudio: false

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'source-toggle-2'
- tapOn:
    id: 'source-toggle-3'
- assertVisible: '3/5 enabled'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 20000
- extendedWaitUntil:
    visible: 'source=3 state=live.*'
    timeout: 20000

- assertVisible: 'output src=CAM3 .*'
- assertVisible: 'source=3 .*onair=1'
- assertVisible: 'source=2 .*onair=0'

- tapOn:
    id: 'record-button'

# Any two-digit duration from twenty seconds up. A bounded window like `1[5-9]` is a race the
# machine wins whenever the polling interval steps over those five seconds.
- extendedWaitUntil:
    visible: 'dur=[2-9][0-9]'
    timeout: 60000

- swipe:
    start: "93%, 42%"
    end: "68%, 42%"
    duration: 900

# Cut immediately: a replay runs only until it reaches the live edge of the assembled playlist,
# so every poll spent confirming the rewound state is a chance to lose it.
- tapOn:
    id: 'source-2'

- takeScreenshot: operator-scrub-non-program

- assertVisible: 'rec=1'
- assertVisible: 'replayerr=ok'
# The replayed first frame arrived, which is what makes this a cut from a rewound tile rather
# than a cut from a live one.
- extendedWaitUntil:
    visible: 'replayms=[1-9][0-9]{0,3}'
    timeout: 10000
- extendedWaitUntil:
    visible: 'output src=CAM2 .*'
    timeout: 8000
- assertVisible: 'source=2 .*onair=1'
- assertVisible: 'source=1 .*onair=0'

- tapOn:
    id: 'return-to-live-2'
    optional: true
- extendedWaitUntil:
    visible: 'source=2 state=live .*off=0\.0.*'
    timeout: 25000

# Displayed-frame rate, not received-frame rate: `f=` ticks on a frozen preview.
- extendedWaitUntil:
    visible: 'source=2 state=live .*out=[1-9]'
    timeout: 10000
- extendedWaitUntil:
    visible: 'source=1 state=live .*out=[1-9]'
    timeout: 8000
- extendedWaitUntil:
    visible: 'source=3 state=live .*out=[1-9]'
    timeout: 8000
- assertVisible: 'output src=CAM2 .*composed=[1-9]'

# Second pass: rewind a non-program tile, Return to Live, PROGRAM stays on CAM2, previews play.
- swipe:
    start: "28%, 72%"
    end: "8%, 72%"
    duration: 900

- extendedWaitUntil:
    visible: 'source=3 state=(scrubbing|replaying).*off=-|replayms=[1-9][0-9]{0,3}'
    timeout: 10000

- tapOn:
    id: 'return-to-live-3'
    optional: true
- extendedWaitUntil:
    visible: 'source=3 state=live .*off=0\.0.*'
    timeout: 10000
- extendedWaitUntil:
    visible: 'source=3 state=live .*out=[1-9]'
    timeout: 10000
- assertVisible: 'output src=CAM2 .*'
- assertVisible: 'source=2 state=live .*out=[1-9]'

- tapOn:
    id: 'record-button'
- runFlow: shared/slide-to-stop.yaml
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 60000
