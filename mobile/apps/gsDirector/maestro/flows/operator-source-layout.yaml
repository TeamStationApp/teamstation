# B12/B13: source tiles are labelled "source N: name"; long-press order is by source
# number and survives a relaunch. The swap-on-hover path is unit-tested; this flow
# checks the nameplate and that the same store the gesture writes is restored.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      sourceCount: 3
      syntheticEntropy: low

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'source-toggle-2'
- tapOn:
    id: 'source-toggle-3'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 20000
- extendedWaitUntil:
    visible: 'source=3 state=live.*'
    timeout: 15000

- assertVisible: 'source 1: CAM1'
- assertVisible: 'source 2: CAM2'
- assertVisible: 'source 3: CAM3'
- assertVisible: 'order=1,2,3,4,5'

- openLink: 'gsdirector://test/source-layout?order=5,1,2,3,4'
- extendedWaitUntil:
    visible: 'order=5,1,2,3,4'
    timeout: 8000
- assertVisible: 'source 1: CAM1'
- assertVisible: 'source 5: —'

- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: false
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
- tapOn:
    id: 'start-directing'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'output'
    timeout: 20000
- assertVisible: 'order=5,1,2,3,4'
- assertVisible: 'source 1: CAM1'
- assertVisible: 'output src=CAM3 .*'
