# The delay line turns the cameras' burst-and-wait delivery back into even motion.
#
# The evidence is the pair of gaps on one tile: `gap` is how unevenly the frames arrived, `rel` is how
# unevenly they reached the screen. Asserting on `rel` alone would pass on a camera that was not
# bursting in the first place, so this waits for a stream that is demonstrably bursty and then checks
# what came out the other side.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: rtsp

- runFlow: shared/allow-local-network.yaml

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 60000
- runFlow: shared/settle-source-list.yaml

- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'source-toggle-2'
- tapOn:
    id: 'source-toggle-3'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 .*state=live.*'
    timeout: 30000

# Long enough for the controller's ten-second window to fill and for the buffer to reach the size the
# cameras actually need.
- extendedWaitUntil:
    visible: 'source=1 .*pl=[1-9][0-9][0-9].*'
    timeout: 40000

# Arrivals at least three frame intervals apart: this camera is bursting, so the assertion below is
# testing something.
- assertVisible: 'source=1 .*gap=(1[0-9][0-9]|[2-9][0-9][0-9]).*'

# And no more than two frame intervals between frames reaching the screen, with nothing arriving after
# it was due.
- assertVisible: 'source=1 .*rel=([0-9]|[1-9][0-9]) .*'
- assertVisible: 'source=1 .*late=0.*'
- assertVisible: 'source=2 .*late=0.*'
- assertVisible: 'source=3 .*late=0.*'
