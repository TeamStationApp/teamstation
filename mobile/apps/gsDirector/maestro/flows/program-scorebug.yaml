# Brings the grid up on the real cameras with a scorebug URL set, so the program tile and the
# composited output can be checked together.
#
# The scorebug is served by tools/scorebugServer.js on the Mac; pass its address as
# SCOREBUG_URL when running this flow. The default points at the machine this was written on.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      uiTest: true
      sourceProfile: synthetic4
      cameraCodec: hevc
      segmentSeconds: 3
      debugHUD: false
      scoreboardURL: 'http://192.168.7.195:8000/scoreboard'

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 30000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible:
      id: 'output-tile'
    timeout: 30000
