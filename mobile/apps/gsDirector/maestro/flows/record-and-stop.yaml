# Recording has to start, produce segments, and — the part that actually broke — stop.
#
# A recording that will not stop is indistinguishable from a slow one unless the flow waits for
# the HUD to report `rec=0`, so that is what this asserts.
#
# Selectors that check a value are text-only: this runner ignores `text` when an `id` is also
# present, which makes `{id: hud-recording, text: rec=0}` pass the moment the label exists.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      segmentSeconds: 3

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'source-toggle-2'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'tile=1 state=live.*'
    timeout: 15000

- tapOn:
    id: 'record-button'
- assertVisible: 'rec=1'

# Long enough for several 3-second segments across both cameras.
- extendedWaitUntil:
    visible: 'seg=[1-9][0-9]*'
    timeout: 30000

- tapOn:
    id: 'record-button'
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 60000

# A stop that leaves writers hanging still reports rec=0, so assert the flush actually completed
# and that the program encoder produced a file. Both were silently broken for a long time.
- assertVisible: 'flush=[0-9]+\.[0-9]'
- assertVisible: 'progbytes=[1-9][0-9]{5,}'

- takeScreenshot: record-stopped
