# After a recording stops, Recordings lists it by date and offers the cameras plus programme.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      segmentSeconds: 2

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'
- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 15000

- tapOn:
    id: 'record-button'
- extendedWaitUntil:
    visible: 'dur=[2-9][0-9]'
    timeout: 60000
- tapOn:
    id: 'record-button'
- runFlow: shared/slide-to-stop.yaml
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 60000

- tapOn:
    id: 'recordings-button'
- extendedWaitUntil:
    visible:
      id: 'recordings-dates'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'recordings-export'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'recordings-select-all'
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'recordings-select-1'
    timeout: 5000
- takeScreenshot: recordings-export
- tapOn:
    id: 'recordings-select-all'
- tapOn:
    id: 'recordings-delete'
- extendedWaitUntil:
    visible:
      id: 'recordings-delete-confirm'
    timeout: 5000
- tapOn:
    id: 'recordings-delete-confirm'
- extendedWaitUntil:
    visible:
      id: 'recordings-empty'
    timeout: 10000
- takeScreenshot: recordings-deleted
