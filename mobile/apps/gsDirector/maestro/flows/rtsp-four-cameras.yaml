# Four live cameras for the 4-hour stress harness: first, third, mound (Near Stream)
# plus handheld (GS Cameraman).
#
# Do not clearState — operator names live on the camera records.
# Do not pass streamURL — Settings already holds the RTMP ingest.
# Enable with control-channel on=true (idempotent). Do not tap VIDEO toggles:
# if a camera is already on, a tap would turn it off.
# Do not start record/stream here — stressFourHour.js owns those so it can abort.
#
# Not in the operator suite: needs four live cameras and hours of follow-on work.
#
# Launched through Maestro rather than `devicectl` because a `devicectl` launch is never
# offered the local network prompt, so the scan finds nothing.
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      uiTest: true
      debugHUD: true
      sourceProfile: rtsp

- runFlow: shared/allow-local-network.yaml

- extendedWaitUntil:
    visible:
      id: 'source-row-4'
    timeout: 90000
- runFlow: shared/settle-source-list.yaml

- extendedWaitUntil:
    visible: 'rtsp=1'
    timeout: 120000
- assertVisible: 'confirmed=4'
- assertVisible: '1st'
- assertVisible: '3rd'
- assertVisible: 'Mound'
- assertVisible: 'Hand held'
- extendedWaitUntil:
    visible: 'origin=autoByIdentity'
    timeout: 20000

# 1-based source-list indexes. stressFourHour.js still binds by display name so a
# fifth row cannot steal a named camera. on=true is idempotent, unlike VIDEO toggles.
- openLink: 'gsdirector://test/enable-source?index=1&on=true'
- openLink: 'gsdirector://test/enable-source?index=2&on=true'
- openLink: 'gsdirector://test/enable-source?index=3&on=true'
- openLink: 'gsdirector://test/enable-source?index=4&on=true'
- openLink: 'gsdirector://test/start'

- extendedWaitUntil:
    visible:
      id: 'source-4'
    timeout: 30000
- extendedWaitUntil:
    visible: 'source=1 .*state=live.*'
    timeout: 60000
- extendedWaitUntil:
    visible: 'source=2 .*state=live.*'
    timeout: 60000
- extendedWaitUntil:
    visible: 'source=3 .*state=live.*'
    timeout: 60000
- extendedWaitUntil:
    visible: 'source=4 .*state=live.*'
    timeout: 60000
- assertVisible: 'dec=4'
