# Completes the slide-to-stop popup after STREAMING or RECORDING was tapped.
# Device is passed to the runner, not named here.
# Direction-from-id only flicks the track center and never reaches 80% travel. The overlay is
# centered; start on the knob and drag through the right end of the track.
appId: co.gamestation.director
---
- extendedWaitUntil:
    visible:
      id: 'slide-to-stop-track'
    timeout: 8000
- swipe:
    start: '37%, 50%'
    end: '64%, 50%'
    duration: 1200
