# Stream URL in Settings, clear X, empty-URL toast, Stream left of Record, RECORDING not STOP.
# While STREAMING, header-stream-mbps is "N.NN Mbps" and header-stream-drops is "Dropped packets: N".
appId: co.gamestation.director
---
- launchApp:
    appId: co.gamestation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 15000

- assertVisible:
    id: 'stream-button'
- assertVisible:
    id: 'record-button'
- assertVisible:
    id: 'header-thermal'
- assertVisible:
    id: 'recordings-button'
- assertNotVisible:
    id: 'header-rec'
- assertNotVisible:
    id: 'header-stream-mbps'
- assertNotVisible:
    id: 'header-stream-drops'

- tapOn:
    id: 'stream-button'
- extendedWaitUntil:
    visible:
      id: 'status-toast'
    timeout: 5000
# Every toast says when it was posted. The shape is asserted here; which zone name it ends in is
# StatusTimestampTests' business, because that varies with the device's region and this flow runs
# on whatever bench hardware is free.
- assertVisible:
    id: 'status-timestamp'
- assertVisible: '20[0-9]{2}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3} .+'
# The body dismisses, not only the X.
- tapOn:
    id: 'status-message'
- extendedWaitUntil:
    notVisible:
      id: 'status-toast'
    timeout: 5000
# And the X still dismisses, which is the only place that button is exercised.
- tapOn:
    id: 'stream-button'
- extendedWaitUntil:
    visible:
      id: 'status-toast'
    timeout: 5000
- tapOn:
    id: 'status-dismiss'
- extendedWaitUntil:
    notVisible:
      id: 'status-toast'
    timeout: 5000

- tapOn:
    id: 'settings-button'
- scrollUntilVisible:
    element:
      id: 'settings-stream-url'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'settings-stream-url'
- inputText: 'rtmp://example.test/live/key'
- tapOn:
    id: 'settings-stream-url-clear'
- tapOn:
    id: 'settings-cancel'

- tapOn:
    id: 'record-button'
- assertVisible: 'rec=1'
- assertVisible: 'RECORDING'
- tapOn:
    id: 'record-button'
- runFlow: shared/slide-to-stop.yaml
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 60000
