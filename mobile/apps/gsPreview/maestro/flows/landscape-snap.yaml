appId: co.gamestation.preview
---
- launchApp:
    clearState: true
    arguments:
      uiTest: true
      syntheticCameras: "00001 3rd,00001 1st,00001 mound"
- runFlow: shared/allow-local-network.yaml
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: preview-tile-1
- swipe:
    direction: UP
    duration: 400
- assertVisible:
    id: "preview-tile-.*"
