# B1–B4: tap any live camera to put it on PROGRAM. Exactly one program at a time.
appId: co.gamestation.producer
---
- launchApp:
    appId: co.gamestation.producer
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      sourceCount: 3
      syntheticEntropy: low

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'source-toggle-2'
- tapOn:
    id: 'source-toggle-3'
- assertVisible: '3/5 enabled'
- tapOn:
    id: 'start-production'

- extendedWaitUntil:
    visible: 'tile=1 state=live.*'
    timeout: 20000
- extendedWaitUntil:
    visible: 'tile=3 state=live.*'
    timeout: 15000

- assertVisible: 'output src=CAM1 .*'
- assertVisible: 'tile=1 .*onair=1'
- assertVisible: 'tile=2 .*onair=0'
- assertVisible: 'tile=3 .*onair=0'

- tapOn:
    id: 'tile-2'
- extendedWaitUntil:
    visible: 'output src=CAM2 .*'
    timeout: 8000
- assertVisible: 'tile=2 .*onair=1'
- assertVisible: 'tile=1 .*onair=0'

- tapOn:
    id: 'tile-3'
- extendedWaitUntil:
    visible: 'output src=CAM3 .*'
    timeout: 8000
- assertVisible: 'tile=3 .*onair=1'

- tapOn:
    id: 'tile-3'
- assertVisible: 'output src=CAM3 .*'
- assertVisible: 'tile=3 .*onair=1'

- tapOn:
    id: 'tile-1'
- extendedWaitUntil:
    visible: 'output src=CAM1 .*'
    timeout: 8000
- assertVisible: 'tile=1 .*onair=1'
- assertVisible: 'tile=2 .*onair=0'
- assertVisible: 'tile=3 .*onair=0'
