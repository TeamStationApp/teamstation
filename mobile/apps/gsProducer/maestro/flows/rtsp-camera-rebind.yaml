# Correcting a name the app guessed wrong, by picking a camera out of the cache.
#
# This is the case DHCP creates: two cameras swap leases overnight, so each is auto-matched to the
# other's name. The operator has to be able to fix it in one tap per row, without typing.
appId: co.gamestation.producer
---
- launchApp:
    appId: co.gamestation.producer
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: rtsp

- runFlow: shared/allow-local-network.yaml

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 60000
- runFlow: shared/settle-source-list.yaml

- tapOn:
    id: 'source-name-menu-1'
- tapOn:
    id: 'camera-rename-1'
- eraseText
- inputText: 'Third Base'
- pressKey: Enter

- tapOn:
    id: 'source-name-menu-2'
- tapOn:
    id: 'camera-rename-2'
- eraseText
- inputText: 'First Base'
- pressKey: Enter

- extendedWaitUntil:
    visible: 'name=Third Base'
    timeout: 10000
- extendedWaitUntil:
    visible: 'name=First Base'
    timeout: 10000

# Row 1 is pointed at the camera row 2 currently holds. Both rows have to end up describing the
# right camera: the one being taken from cannot keep the name as well.
- tapOn:
    id: 'source-name-menu-1'
- tapOn:
    id: 'camera-choice-first-base'

- extendedWaitUntil:
    visible: 'name=First Base .*origin=manual'
    timeout: 10000
- assertNotVisible: 'name=First Base .*origin=autoByHost'

# H8: forget an auto-bound camera, not the swapped row. The swapped camera is held manual on
# another address, so forgetting it cannot re-adopt that serial onto the row the operator just
# corrected. Row 3 is still AUTO; deleting it must leave the row and restore the NearStream name.
- scrollUntilVisible:
    element:
      id: 'source-row-3'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'source-name-menu-3'
- tapOn: 'Forget this camera'
- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 10000
- extendedWaitUntil:
    visible: 'origin=autoByIdentity'
    timeout: 15000
