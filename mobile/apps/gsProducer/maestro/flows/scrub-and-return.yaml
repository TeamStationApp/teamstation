# Scrubbing back must not stop the recording underneath. That is the whole point of the DVR, and
# it is invisible from the outside: the flow checks that the tile reports a replay offset while
# the recording keeps running, then that it snaps back to live.
#
# Selectors that check a value are text-only — this runner ignores `text` when an `id` is also
# present. See maestro/flows/matcher-check.yaml.
appId: co.gamestation.producer
---
- launchApp:
    appId: co.gamestation.producer
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      segmentSeconds: 2
      archiveAudio: false

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-production'

- extendedWaitUntil:
    visible: 'tile=1 state=live.*'
    timeout: 15000

- tapOn:
    id: 'record-button'

# Build real history before scrubbing. A replay plays forward from the scrub point to the live edge
# as it stood when the drag ended, so it lasts exactly as long as the scrub was deep. With only a
# few seconds recorded the tile snaps back to live almost immediately and every assertion after the
# swipe becomes a race. `dur` is this recording's length; `seg` accumulates across recordings and
# cannot be used for this.
- extendedWaitUntil:
    visible: 'dur=[2-9][0-9]'
    timeout: 60000

# Drag right-to-left across the tile to move backwards in time.
- swipe:
    start: "93%, 27%"
    end: "68%, 27%"
    duration: 900

- extendedWaitUntil:
    visible: 'tile=1 state=(scrubbing|replaying).*'
    timeout: 10000

# Still recording while the tile shows the past.
- assertVisible: 'rec=1'

# R6: the HUD reports milliseconds from the drag ending to the first replayed frame. Asserting a
# non-zero one-to-four digit value proves the replay actually produced a frame and pins the number
# under ten seconds; the exact figure goes in docs/risks.md rather than being hard-coded here, since
# it depends on how deep the scrub was and how many segments had to be concatenated.
# R6 when the archive can replay; otherwise the tile must stay on the proxy still
# rather than snapping to live (the "rewind never works" failure mode).
- extendedWaitUntil:
    visible: 'replayms=[1-9][0-9]{0,3}$|Holding still'
    timeout: 15000

- tapOn:
    id: 'return-to-live-1'
- extendedWaitUntil:
    visible: 'tile=1 state=live .*off=0\.0.*'
    timeout: 10000
- extendedWaitUntil:
    visible: 'tile=1 state=live .*out=[1-9]'
    timeout: 10000

- tapOn:
    id: 'record-button'
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 60000
