name: Cameraman

options:
  bundleIdPrefix: app.teamstation
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # iPhone only. An iPad runs it scaled, which is acceptable; a stretched layout is not a target.
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_MODULE_VERIFIER: NO

packages:
  TeamStationObservability:
    path: ../common/TeamStationObservability
  # Crash reporting, shared by the iOS apps.
  TeamStationSentry:
    path: ../common/TeamStationSentry
  # Shared with TS Director and TS Preview, which draw the same operating screen for a remote phone.
  CameramanCore:
    path: ../common/CameramanCore
  CameramanControlUI:
    path: ../common/CameramanControlUI
  CameramanCapture:
    path: ../common/CameramanCapture
  CameramanEncode:
    path: Packages/CameramanEncode
  CameramanRTSP:
    path: Packages/CameramanRTSP
  AdaptiveBitrate:
    path: ../common/AdaptiveBitrate
  CameramanUI:
    path: Packages/CameramanUI
  CameramanTestHarness:
    path: Packages/CameramanTestHarness
  # The device event-control protocol: a Director on the local network setting the scoreboard event.
  EventControl:
    path: ../common/EventControl
  # Sign-in links: what a link handed to the app means, shared with TS Director.
  TeamStationKit:
    path: ../common/TeamStationKit
  # Test target only. Packetizers are round-tripped through the shared DirectorRTSP depacketizers
  # in mobile/apps/common. This compiles that package; it never builds or launches the Director app.
  DirectorRTSP:
    path: ../common/DirectorRTSP
  # Same reason: the camera-identity rules that adopt our advertised name are pure value logic.
  DirectorSources:
    path: ../common/DirectorSources

targets:
  Cameraman:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teamstation.cameraman
        PRODUCT_NAME: TS Cameraman
        INFOPLIST_FILE: App/Info.plist
        # Empty unless the build's clientConfig.xcconfig names a link host; see App/Cameraman.entitlements.
        CODE_SIGN_ENTITLEMENTS: $(TS_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - package: TeamStationSentry
        product: TeamStationSentry
      - package: TeamStationObservability
        product: TeamStationObservability
      - package: CameramanCore
        product: CameramanCore
      - package: CameramanControlUI
        product: CameramanControlUI
      - package: CameramanCapture
        product: CameramanCapture
      - package: CameramanEncode
        product: CameramanEncode
      - package: CameramanRTSP
        product: CameramanRTSP
      - package: AdaptiveBitrate
        product: AdaptiveBitrate
      - package: CameramanUI
        product: CameramanUI
      - package: CameramanTestHarness
        product: CameramanTestHarness
      - package: EventControl
        product: EventControl
      - package: TeamStationKit
        product: TeamStationKit

  CameramanUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CameramanUnitTests
        excludes:
          - Fixtures/**
      - path: ../common/TeamStationSentry/Tests/TeamStationSentryTests
    dependencies:
      - target: Cameraman
      - package: TeamStationSentry
        product: TeamStationSentry
      - package: TeamStationObservability
        product: TeamStationObservability
      - package: CameramanCore
        product: CameramanCore
      - package: CameramanControlUI
        product: CameramanControlUI
      - package: CameramanCapture
        product: CameramanCapture
      - package: CameramanEncode
        product: CameramanEncode
      - package: CameramanRTSP
        product: CameramanRTSP
      - package: AdaptiveBitrate
        product: AdaptiveBitrate
      - package: CameramanUI
        product: CameramanUI
      - package: CameramanTestHarness
        product: CameramanTestHarness
      - package: EventControl
        product: EventControl
      - package: DirectorRTSP
        product: DirectorRTSP
      - package: DirectorSources
        product: DirectorSources
      - package: TeamStationKit
        product: TeamStationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teamstation.cameraman.unittests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives the test host from the target name, `Cameraman`, but the app's
        # PRODUCT_NAME is `TS Cameraman`, so without this the host path names an app that is
        # never built and the scheme fails before any test runs.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TS Cameraman.app/TS Cameraman
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Cameraman:
    build:
      targets:
        Cameraman: all
        CameramanUnitTests: [ test ]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CameramanUnitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
