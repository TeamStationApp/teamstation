org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The React Native app's opt-outs from AGP 9's built-in Kotlin and new DSL, kept the same here so
# the shared :streamcore module is configured identically in both builds.
android.builtInKotlin=false
android.newDsl=false
