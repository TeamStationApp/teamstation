# Defaults after a clean launch: HEVC programme master, 3 s camera segments, no 2.5 s rewind.
# Do not pass `programCodec` or `segmentSeconds` — those launch args would hide the code defaults.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      sourceCount: 1
      syntheticEntropy: low
      archiveAudio: false

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 20000

- tapOn:
    id: 'settings-button'
- scrollUntilVisible:
    element:
      id: 'settings-segment'
    direction: DOWN
    timeout: 10000
- assertVisible: 'Segment 3s'
- scrollUntilVisible:
    element:
      id: 'settings-codec'
    direction: DOWN
    timeout: 10000
- assertVisible: 'HEVC'
- tapOn:
    id: 'settings-cancel'

- assertVisible:
    id: 'source-1-replay-5'
- assertVisible:
    id: 'source-1-replay-7.5'
- assertVisible:
    id: 'source-1-replay-10'
- assertVisible:
    id: 'source-1-replay-slow-5'
- assertVisible:
    id: 'source-1-replay-slow-7.5'
- assertVisible:
    id: 'source-1-replay-slow-10'
- assertNotVisible:
    id: 'source-1-replay-2.5'
- assertNotVisible:
    id: 'source-1-replay-slow-2.5'
- assertVisible:
    id: 'output-replay-5'
- assertNotVisible:
    id: 'output-replay-2.5'

- tapOn:
    id: 'record-button'
- assertVisible: 'rec=1'
# 3 s segments plus a keyframe after the floor: wait until two files have closed so a 5 s
# seek lands in archived media, not the open GOP.
- extendedWaitUntil:
    visible: 'dur=1[0-9]'
    timeout: 25000
- extendedWaitUntil:
    visible: 'seg=[2-9]'
    timeout: 15000

- tapOn:
    id: 'source-1-replay-5'
- extendedWaitUntil:
    visible: 'source=1 state=replaying.*off=-'
    timeout: 10000
- extendedWaitUntil:
    visible: 'replayms=[1-9][0-9]{0,3}'
    timeout: 10000
- assertNotVisible: 'Holding still'

# A 5 s replay returns to live on its own; the button is gone if catch-up already finished.
- tapOn:
    id: 'return-to-live-1'
    optional: true
- extendedWaitUntil:
    visible: 'source=1 state=live .*off=0\.0.*'
    timeout: 15000

- tapOn:
    id: 'record-button'
- runFlow: shared/slide-to-stop.yaml
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 30000
