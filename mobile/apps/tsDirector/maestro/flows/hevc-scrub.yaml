# HEVC archive replay: drag left on the program source tile and stay in the past.
#
# live.yaml uses HEVC; the older scrub-and-return flow used H.264 concat which hid the
# mpeg4AppleHLS decode failure. This flow uses the same writer profile as the cameras.
#
# A closed-segment archive starts moving replay. If the writer has not closed a file yet
# (thermal stall, first seconds), the tile must hold the proxy still — not snap to live.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      cameraCodec: hevc
      segmentSeconds: 2
      archiveAudio: false

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 15000

- tapOn:
    id: 'record-button'

- extendedWaitUntil:
    visible: 'dur=[2-9][0-9]'
    timeout: 60000

# Drag right-to-left across the source tile. `from: id` + direction LEFT is a short
# flick from the centre; a modest translation on a young recording catches up to live
# before the next assertion. Span the tile instead.
- swipe:
    start: "93%, 27%"
    end: "68%, 27%"
    duration: 900

# Either the rewound state or the latency of the replayed first frame. A replay ends when it
# reaches the live edge of the assembled playlist, which can be a second or two later, so the
# rewound state is not guaranteed to still be on screen when the next poll comes round; the
# latency reading stays put and is the evidence that HEVC segments decoded.
- extendedWaitUntil:
    visible: 'source=1 state=(scrubbing|replaying).*off=-|replayms=[1-9][0-9]{0,3}'
    timeout: 10000

- takeScreenshot: hevc-scrub-after-swipe

- extendedWaitUntil:
    visible: 'replayms=[1-9][0-9]{0,3}$|Holding still'
    timeout: 8000

- assertVisible: 'rec=1'

- tapOn:
    id: 'return-to-live-1'
    optional: true
- extendedWaitUntil:
    visible: 'source=1 state=live .*off=0\.0.*'
    timeout: 30000
- extendedWaitUntil:
    visible: 'source=1 state=live .*out=[1-9]'
    timeout: 10000
