# Diagnostic, not a product test: proves whether combining `id` and `text` in one selector actually
# requires both to match. If this flow PASSES, `text` is being ignored whenever `id` is present, and
# every assertion in the suite written that way is vacuous.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4

- assertVisible:
    id: 'enabled-count'
    text: 'this-text-cannot-possibly-match-anything'
