# Brings the director grid up on the real cameras so a recording can be started over the
# control channel and memory sampled. Does not record itself — the sampler owns Record/Stop so it
# can abort the moment the footprint climbs.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      cameraCodec: hevc

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 30000
- tapOn:
    id: 'start-directing'
- extendedWaitUntil:
    visible:
      id: 'output'
    timeout: 30000
