# Brings the grid up on synthetic cameras so the program tile and the composited output
# can be checked together.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      uiTest: true
      sourceProfile: synthetic4
      cameraCodec: hevc
      segmentSeconds: 3
      debugHUD: false

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 30000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible:
      id: 'output'
    timeout: 30000
