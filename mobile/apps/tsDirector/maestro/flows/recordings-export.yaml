# After a recording stops, Recordings lists it by date and offers the cameras plus programme.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      segmentSeconds: 2

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'
- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 15000

- tapOn:
    id: 'record-button'
- extendedWaitUntil:
    visible: 'dur=[2-9][0-9]'
    timeout: 60000
- tapOn:
    id: 'record-button'
- runFlow: shared/slide-to-stop.yaml
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 60000

- tapOn:
    id: 'recordings-button'
- extendedWaitUntil:
    visible:
      id: 'recordings-dates'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'recordings-export'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'recordings-select-all'
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'recordings-select-1'
    timeout: 5000
- takeScreenshot: recordings-export

# Clean up after this flow and nothing else. Row 1 is the take this flow just recorded — the
# list is ordered newest first, and the recording finished seconds ago — so marking row 1 marks
# exactly what was created here.
#
# This used to tap `recordings-select-all`, which deleted every recording on the device. On an
# iPad that had been shot with, that is somebody's game.
- tapOn:
    id: 'recordings-select-1'
- tapOn:
    id: 'recordings-delete'
- extendedWaitUntil:
    visible:
      id: 'recordings-delete-confirm'
    timeout: 5000
- tapOn:
    id: 'recordings-delete-confirm'

# The list survives: only this flow's own take went. Asserting `recordings-empty` would be
# asserting that the device had been wiped.
- extendedWaitUntil:
    visible:
      id: 'recordings-dates'
    timeout: 10000
- takeScreenshot: recordings-deleted
