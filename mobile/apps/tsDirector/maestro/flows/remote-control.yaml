# Remote Control: Settings list/editor plus control-channel injected chords.
# Targets the device/simulator UDID passed to maestro-runner. Does not boot or
# shut down a simulator — run-maestro.js must not pass --start-simulator.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      sourceCount: 3
      syntheticEntropy: low

- extendedWaitUntil:
    visible:
      id: 'source-row-3'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'source-toggle-2'
- tapOn:
    id: 'source-toggle-3'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 20000
- extendedWaitUntil:
    visible: 'source=3 state=live.*'
    timeout: 15000

- tapOn:
    id: 'settings-button'
- extendedWaitUntil:
    visible:
      id: 'settings-remote-template-1'
    timeout: 10000
- tapOn:
    id: 'settings-remote-template-1'

- extendedWaitUntil:
    visible:
      id: 'remote-editor-done'
    timeout: 10000
- assertVisible:
    id: 'remote-editor-rename'
- assertVisible: 'source1:live'
- assertVisible:
    id: 'remote-action-live-0'
- assertVisible:
    id: 'remote-chord-field-live-0'
- assertVisible: 'rewind 5 seconds'
- assertVisible: 'primary'
- assertVisible: 'modifier'
- tapOn:
    id: 'remote-editor-done'
- extendedWaitUntil:
    notVisible:
      id: 'remote-editor-done'
    timeout: 10000
- assertNotVisible:
    id: 'settings-remote-template-rename-1'

- tapOn:
    id: 'settings-cancel'
- extendedWaitUntil:
    visible: 'source=1 .*onair=1'
    timeout: 10000

- openLink: 'tsdirector://test/bind-remote?action=live-2&controls=a'
- openLink: 'tsdirector://test/remote-chord?controls=a'
- extendedWaitUntil:
    visible: 'source=2 .*onair=1'
    timeout: 8000
- assertVisible: 'source=1 .*onair=0'
- assertVisible: 'output src=CAM2 .*'
