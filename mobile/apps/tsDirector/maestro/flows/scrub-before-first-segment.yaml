# Scrubbing must work from 1 fps proxy stills within seconds of Record — before the
# first archive segment has closed. Default segments are 3 s; gating on those files
# refused the drag until the first one finished, then again whenever the in-progress
# file was more than 5 s old, and forever at T3 where nothing is archived at all.
#
# Do not pass `segmentSeconds`: this flow is specifically about the default segment length.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 15000

- tapOn:
    id: 'record-button'

# Still in the first open segment (`dur` 4–9, `seg` still 0 for this recording's
# first file). Proxies should already exist at 1 fps.
- extendedWaitUntil:
    visible: 'dur=[4-9]'
    timeout: 20000
- extendedWaitUntil:
    visible: 'proxy=[1-9]'
    timeout: 10000

# Coordinates rather than `from: id` with a direction: an element-relative swipe does not move
# far enough across the tile for the drag to register as a scrub, and the flow then reads as
# "scrubbing is broken" when nothing was ever dragged.
- swipe:
    start: "93%, 27%"
    end: "68%, 27%"
    duration: 700

- extendedWaitUntil:
    visible: 'source=1 state=(scrubbing|replaying).*'
    timeout: 10000

- assertVisible: 'rec=1'
