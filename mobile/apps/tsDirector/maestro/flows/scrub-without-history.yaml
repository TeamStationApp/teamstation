# Scrubbing before anything has been recorded must refuse, and say why.
#
# The archive is only written while recording, so a drag at this point has no past to show. What it
# used to do was start the scrub anyway: the tile paused on its last live frame, the proxy lookup
# returned the nearest still it could find — one left behind by an earlier recording, unchanged for
# every offset because it stayed the nearest match — and releasing the finger snapped back to live
# when the assembler found no segments. Three symptoms, one missing precondition.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      clearState: true
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      segmentSeconds: 2

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 15000
- runFlow: shared/settle-source-list.yaml
- tapOn:
    id: 'source-toggle-1'
- tapOn:
    id: 'start-directing'

- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 15000

# Not recording, so there is no history behind this tile.
- assertVisible: 'rec=0'

# Coordinates rather than `from: id` with a direction: an element-relative swipe does not move
# far enough across the tile for the drag to register, and a flow that never starts a scrub
# cannot prove the refusal.
- swipe:
    start: "93%, 27%"
    end: "68%, 27%"
    duration: 700

- extendedWaitUntil:
    visible: 'Nothing to scrub.*'
    timeout: 10000

# The tile is still live and unfrozen rather than paused on a stale still.
- assertVisible: 'source=1 state=live .*off=0\.0.*'
