# The rec-253 shape: the programme writer dies mid-take, then the operator stops normally.
# Asserts nothing — this exists to produce the artefact so the Program directory can be diffed.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      uiTest: true
      debugHUD: true
      sourceProfile: synthetic4
      segmentSeconds: 3

- extendedWaitUntil:
    visible:
      id: 'source-row-1'
    timeout: 20000
- runFlow: shared/settle-source-list.yaml
- openLink: 'tsdirector://test/enable-source?index=1&on=true'
- openLink: 'tsdirector://test/enable-source?index=2&on=true'
- openLink: 'tsdirector://test/start'
- extendedWaitUntil:
    visible: 'source=1 state=live.*'
    timeout: 30000

- tapOn:
    id: 'record-button'
- assertVisible: 'rec=1'
- extendedWaitUntil:
    visible: 'dur=(3[0-9]|4[0-9])'
    timeout: 90000

# Kill the live writer the way a muxer error would.
- openLink: 'tsdirector://test/kill-program-writer'
- takeScreenshot: writer-killed

# Keep recording so the continuation writer takes over, then stop the ordinary way.
- extendedWaitUntil:
    visible: 'dur=(6[0-9]|7[0-9])'
    timeout: 90000
- tapOn:
    id: 'record-button'
- runFlow: shared/slide-to-stop.yaml
- extendedWaitUntil:
    visible: 'rec=0'
    timeout: 120000
- takeScreenshot: after-stop-death
