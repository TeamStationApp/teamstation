# The TeamStation account, at the top of Settings and on its own.
#
# No `clearState`: this runs against the iPad as the operator left it. That
# matters — a Director in the field still has a `teamStationURL` saved from
# when the address was a setting, and this flow reaching the live event list
# is what proves the bundled config.json is what gets used now.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
    arguments:
      uiTest: true

- tapOn:
    id: 'start-directing'
- tapOn:
    id: 'settings-button'

# First thing on the screen, without scrolling.
- assertVisible:
    id: 'settings-teamstation-account'
- takeScreenshot: /tmp/dirShots/configTop

# The streaming section is the next one down, and still holds both destinations.
- assertVisible:
    id: 'settings-stream-destination-event'
- assertVisible:
    id: 'settings-stream-destination-url'

# The list only fills from the server, so this is the address being right.
- tapOn:
    id: 'settings-teamstation-event'
- waitForAnimationToEnd
- takeScreenshot: /tmp/dirShots/configEvents
