# Uploads take 407 — a ten-minute bench recording — to one finished game, as
# the primary output and the home camera. Deletes nothing: no `clearState`,
# and nowhere near Select All, Delete, or the per-row circles.
appId: app.teamstation.director
---
- launchApp:
    appId: app.teamstation.director
- extendedWaitUntil:
    visible:
      id: 'start-directing'
    timeout: 30000
- tapOn:
    id: 'start-directing'
- extendedWaitUntil:
    visible:
      id: 'recordings-button'
    timeout: 30000
- tapOn:
    id: 'recordings-button'
- extendedWaitUntil:
    visible:
      id: 'recordings-dates'
    timeout: 25000

- tapOn:
    id: 'recording-row-407'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: shot-407-chosen

# The two side cameras off; the primary output and home stay on.
- tapOn:
    id: 'recording-file-29643F63-D330-42EF-9C1F-BB6DA4A61D1B'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'recording-file-4E681037-A89D-469C-B4B4-64125F13233B'
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: shot-407-files

- tapOn:
    id: 'recordings-upload'
- extendedWaitUntil:
    visible:
      id: 'upload-event-gam_demo000000000003'
    timeout: 40000
- tapOn:
    id: 'upload-event-gam_demo000000000003'
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: shot-407-started
