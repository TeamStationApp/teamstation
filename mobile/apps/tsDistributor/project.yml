name: Distributor

options:
  bundleIdPrefix: app.teamstation
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: G5LQ7MERPK
    # Signed with the team's development identity rather than ad hoc, so every build is the same
    # app to the Keychain and the TeamStation session kept there is read without a prompt. Not sandboxed:
    # usbmuxd's socket is outside any sandbox.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ALWAYS_SEARCH_USER_PATHS: NO

packages:
  DirectorCore:
    path: ../common/DirectorCore
  DirectorExport:
    path: ../common/DirectorExport
  DistributorWire:
    path: ../common/DistributorWire
  TeamStationKit:
    path: ../common/TeamStationKit
  UsbMux:
    path: Packages/UsbMux
  DirectorClient:
    path: Packages/DirectorClient
  Distribution:
    path: Packages/Distribution
  MacState:
    path: Packages/MacState
  LoopbackHTTP:
    path: ../common/LoopbackHTTP
  DistributorAPI:
    path: Packages/DistributorAPI

targets:
  Distributor:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teamstation.distributor
        PRODUCT_NAME: TS Distributor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TS Distributor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: TeamStation
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        # Adds TSPrimaryHost, which no INFOPLIST_KEY_ build setting can
        # express; the rest of the plist is still generated below.
        INFOPLIST_FILE: App/Info.plist
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - package: DirectorCore
        product: DirectorCore
      - package: DirectorExport
        product: DirectorExport
      - package: DistributorWire
        product: DistributorWire
      - package: TeamStationKit
        product: TeamStationKit
      - package: UsbMux
        product: UsbMux
      - package: DirectorClient
        product: DirectorClient
      - package: Distribution
        product: Distribution
      - package: MacState
        product: MacState
      - package: LoopbackHTTP
        product: LoopbackHTTP
      - package: DistributorAPI
        product: DistributorAPI

schemes:
  Distributor:
    build:
      targets:
        Distributor: all
    run:
      config: Debug
    archive:
      config: Release
