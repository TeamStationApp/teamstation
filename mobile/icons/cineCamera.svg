<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Side-view cine camera on a tripod: two film magazines, body, lens, legs. -->
  <g stroke="#1F2418" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Magazines ("Mickey Mouse ears") -->
    <circle cx="36" cy="26" r="13"/>
    <circle cx="58" cy="26" r="13"/>
    <!-- Body -->
    <rect x="26" y="36" width="42" height="26" rx="2"/>
    <!-- Viewfinder bump on the rear -->
    <rect x="18" y="42" width="10" height="10" rx="1.5"/>
    <!-- Lens barrel + front element, facing right -->
    <rect x="68" y="42" width="12" height="14" rx="1"/>
    <circle cx="86" cy="49" r="9"/>
    <circle cx="86" cy="49" r="4"/>
    <!-- Tripod: stem + three legs -->
    <line x1="47" y1="62" x2="47" y2="72"/>
    <line x1="47" y1="72" x2="28" y2="94"/>
    <line x1="47" y1="72" x2="66" y2="94"/>
    <line x1="47" y1="72" x2="47" y2="92"/>
  </g>
</svg>
