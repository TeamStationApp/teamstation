<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Director's clapboard / slate: hinged striped stick + rectangular body. -->
  <g stroke="#1F2418" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Stick, hinged at left, slightly open -->
    <line x1="16" y1="40" x2="84" y2="22"/>
    <!-- Diagonal stripes on the stick -->
    <line x1="28" y1="37" x2="32" y2="28"/>
    <line x1="40" y1="34" x2="44" y2="25"/>
    <line x1="52" y1="31" x2="56" y2="22"/>
    <line x1="64" y1="27.5" x2="68" y2="18.5"/>
    <line x1="76" y1="24" x2="80" y2="15"/>
    <!-- Hinge -->
    <circle cx="18" cy="40" r="3.5"/>
    <!-- Slate body -->
    <rect x="16" y="40" width="68" height="44" rx="2"/>
    <!-- Field lines on the slate -->
    <line x1="26" y1="54" x2="74" y2="54"/>
    <line x1="26" y1="66" x2="74" y2="66"/>
    <line x1="26" y1="78" x2="54" y2="78"/>
  </g>
</svg>
