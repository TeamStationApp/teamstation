<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- A baseball flying up and to the right: the ball with its two seams and stitches, and cartoon
       speed trails streaming behind it. It flies upward so the ball sits clear of the TeamStation
       mark that signs the icon's lower-right corner. -->
  <g stroke="#1F2418" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ball -->
    <circle cx="70" cy="30" r="20"/>
    <!-- Seams, curving toward each other, turned with the flight -->
    <path d="M 51.9 21.5 Q 63.4 33.8 68.3 49.9"/>
    <path d="M 71.7 10.1 Q 76.6 26.2 88.1 38.5"/>
    <!-- Speed trails, the middle one longest -->
    <line x1="43.7" y1="32.5" x2="21.2" y2="45.5"/>
    <line x1="47.5" y1="43.0" x2="12.8" y2="63.0"/>
    <line x1="54.7" y1="51.5" x2="32.2" y2="64.5"/>
  </g>
  <!-- Stitches across each seam -->
  <g stroke="#1F2418" stroke-width="2.4" stroke-linecap="round">
    <line x1="54.4" y1="28.4" x2="58.9" y2="25.8"/>
    <line x1="59.5" y1="36.1" x2="64.0" y2="33.5"/>
    <line x1="63.6" y1="44.3" x2="68.1" y2="41.7"/>
    <line x1="71.9" y1="18.3" x2="76.4" y2="15.7"/>
    <line x1="76.0" y1="26.5" x2="80.5" y2="23.9"/>
    <line x1="81.1" y1="34.2" x2="85.6" y2="31.6"/>
  </g>
</svg>
