<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No `viewport-fit=cover`. With it the page runs under the rounded corners
      and the camera housing, and on a phone held sideways the island lands on
      the left-hand edge of the picture. Nothing here reads `env(safe-area-
      inset-*)` to get out of the way, and adding padding would not be enough
      either: the layout sizes itself from `window.innerWidth`, which under
      `cover` is the whole screen and not the part of it that can be seen. The
      default insets the page to the safe area and reports that width, so the
      two agree.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2B4221" />
    <title>TeamStation</title>
    <link rel="icon" href="/favicon.ico?v=rounded" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.png?v=rounded" type="image/png" sizes="256x256" />
    <link rel="icon" href="/favicon.svg?v=rounded" type="image/svg+xml" sizes="any" />

    <!--
      Space Grotesk, the one family the app uses. The theme's font stack falls
      back to the system sans, so a blocked or slow font request costs the
      lettering and nothing else — the layout is unchanged because the metrics
      are close enough not to reflow.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!--
      Material Symbols, which the designs are drawn with. Icons were stood in
      for with punctuation at first and it showed: a chevron set as `›` is
      whatever the text font happens to have, which in Space Grotesk is a blunt
      angle bracket rather than the hairline the design uses.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
    />

    <style>
      /* The app paints its own background; this stops a flash before it
         mounts, and keeps the page from scrolling behind a full-height app. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f5f7f1;
      }
      #root {
        display: flex;
      }

      /* React Native Web renders TextInput as a real <input>, which brings the
         browser's own focus ring with it — a blue outline drawn on top of the
         forest border the theme means to show. The theme's focus state is the
         border, so the outline is simply in the way. */
      input:focus,
      textarea:focus,
      [tabindex]:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
