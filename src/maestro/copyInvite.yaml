# Press Copy, and prove the clipboard was actually written.
#
# This exists because `app/platform/clipboard.native.ts` went through the
# whole build and four QA passes without once being run. It is the only
# sibling in the app that *binds a native module* — it imports
# `@react-native-clipboard/clipboard` at module scope and calls `setString` —
# so it is the one that can fail by not being linked, silently, on a screen
# nobody opens. Everything else under `app/platform/` either wraps something
# React Native already has or, like `nativeDriver`, is a constant.
#
# **Driven by deep link, and parameterised by id.** The first version walked
# the home screen looking for a team by name, which tied it to one database
# and broke three separate ways: the name differs between production and a dev
# server, the team may be below the fold, and `text:` is matched as a *regular
# expression*, so `Bay Stars (Mize)` quietly matches nothing because
# `(Mize)` is read as a capture group. An id has none of those problems.
#
#     maestro test -e TEAM_ID=tem_xxx maestro/copyInvite.yaml
#
# The team must already have an invite link — this reads one rather than
# creating one, because it runs against real data and a smoke test has no
# business leaving invite codes behind.
appId: app.teamstation.app
---
- openLink: teamstation://teams/${TEAM_ID}/manage
- runFlow: openConfirm.yaml
- extendedWaitUntil:
    visible: 'WHO CAN WATCH'
    timeout: 30000
# The roster can run to dozens of rows, so the invite panel is a long way
# down. A generous timeout rather than a clever scroll: the list is as long as
# the team is.
- scrollUntilVisible:
    element:
      text: 'Copy the invite link.*'
    direction: DOWN
    timeout: 45000
- tapOn: 'Copy the invite link.*'
# `Copied` is the app's own confirmation, appended to the link's line once the
# clipboard call has returned — so asserting on it asserts that the native
# call succeeded, not merely that a button looked pressable.
- extendedWaitUntil:
    visible: '.*Copied.*'
    timeout: 10000
