# iOS asks before handing a custom-scheme address to an app that is already
# running — `Open in "TeamStation"?` — and Android does not. Whoever opens a
# link answers it where it appears.
#
# The wait is not padding: the alert is presented by the system a beat after
# the address is handed over, and a condition evaluated before it is up simply
# reads as "no alert" and moves on, leaving it on screen over everything that
# follows.
appId: app.teamstation.app
---
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
      - waitForAnimationToEnd:
          timeout: 3000
