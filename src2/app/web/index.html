<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>GameStation</title>
    <style>
      /* The app paints its own background; this stops a white flash before it
         mounts, and keeps the page from scrolling behind a full-height app. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1f2418;
      }
      #root {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
